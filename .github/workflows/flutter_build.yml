name: 🚀 Flutter CI/CD Pipeline Super Complete

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      build_type:
        description: 'Build Type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
          - ios
          - all

env:
  FLUTTER_VERSION: '3.19.6'
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '34'

jobs:
  build_android:
    name: 📱 Build Android
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: 📦 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      
      - name: 📦 Install Dependencies
        run: flutter pub get
      
      - name: 🧪 Run Tests
        run: flutter test --coverage
      
      - name: 🛠️ Build APK
        run: flutter build apk --release --split-per-abi
      
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
      
      - name: 📤 Upload AAB
        run: flutter build appbundle --release
      
      - name: 📤 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab

  build_ios:
    name: 📱 Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'
      
      - name: 📦 Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod setup
          cd ios && pod install && cd ..
      
      - name: 🛠️ Build iOS
        run: flutter build ios --release --no-codesign
      
      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/ipa/*.ipa

  notify:
    name: 📨 Notification
    runs-on: ubuntu-latest
    needs: [build_android, build_ios]
    if: always()
    steps:
      - name: 📊 Build Status
        run: |
          echo "✅ Build Completed!"
          echo "📱 Android: ${{ needs.build_android.result }}"
          echo "🍎 iOS: ${{ needs.build_ios.result }}"
